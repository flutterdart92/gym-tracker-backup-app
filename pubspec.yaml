name: gym_tracker_app_backup
description: "A Flutter app for gym enthusiasts to track diet and workout."
publish_to: 'none'
version: 1.0.0+1
# version: 1.0.0+2
# version: 1.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'
  

dependencies:
  

  flutter:
    sdk: flutter

  # shorebird_code_push: ^1.0.0
  shorebird_code_push: ^2.0.7
  restart_app: ^1.2.1

  # State Management
  provider: ^6.1.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - shorebird.yaml